plugins {
    id 'com.android.application'
}

android {
    namespace 'com.game.shell'
    compileSdk 33

    defaultConfig {
        applicationId "com.game.shell"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
