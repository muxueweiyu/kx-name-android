name: Build Android APK (江湖大侠)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取安卓代码
      uses: actions/checkout@v4

    - name: 2. 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 安装并指定兼容的 Gradle 7.5 版本 (防止新版 Gradle 9 冲突)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 7.5

    - name: 4. 编译打包 Debug APK
      run: gradle assembleDebug

    - name: 5. 提取并重命名 APK 文件
      run: |
        mkdir -p build-output
        cp app/build/outputs/apk/debug/app-debug.apk build-output/江湖大侠-Android-Debug.apk

    - name: 6. 上传 APK 到 GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 江湖大侠-Android-APK
        path: build-output/江湖大侠-Android-Debug.apk
        retention-days: 7
