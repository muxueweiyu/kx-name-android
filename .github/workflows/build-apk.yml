name: Build Android APK (江湖大侠)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 网页手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取安卓代码
      uses: actions/checkout@v4

    - name: 2. 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 3. 编译打包 Debug APK (使用 GitHub 全局 Gradle)
      run: gradle assembleDebug

    - name: 4. 提取并重命名 APK 文件
      run: |
        mkdir -p build-output
        cp app/build/outputs/apk/debug/app-debug.apk build-output/江湖大侠-Android-Debug.apk

    - name: 5. 上传 APK 到 GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 江湖大侠-Android-APK
        path: build-output/江湖大侠-Android-Debug.apk
        retention-days: 7
